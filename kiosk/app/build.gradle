plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anon.kiosk'
    compileSdk 33

    defaultConfig {
        applicationId "com.anon.kiosk"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}